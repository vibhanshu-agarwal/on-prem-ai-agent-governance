# T6 observability stack: OpenLIT (UI + OTLP receiver) + ClickHouse + Grafana, kept in its OWN
# compose project so it never touches the governance stack. Bring it up with
# scripts/observability-up.sh (generates .local/observability.env with random passwords).
#
#   docker compose -f deploy/compose.observability.yml --env-file .local/observability.env up -d
#   (optional profile)   --profile ebpf           OpenLIT Controller (eBPF discovery, see T6.md for the outcome)
# The real gateway (gov-gateway) exports its OTel spans here directly since T8; the T6 "gateway-demo"
# twin is retired.
#
# Network `obs` is a normal bridge (needed to publish 127.0.0.1 ports), external to both projects. It carries
# only telemetry: the gateway joins it to push OTLP to openlit:4318. Agent containers never join it.
#
# Pinned: OpenLIT 2.1.0 (release 2026-09-10), ClickHouse 24.4.1 (the version OpenLIT's own compose pins),
# Grafana OSS 11.6.1 + ClickHouse datasource plugin 4.11.2.
name: govpilot-obs

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.4.1@sha256:2e6587b81a267c6152cf2112c3532516424d3eaa36f1b150d5b8847c0e3d5b01
    container_name: gov-obs-clickhouse
    restart: unless-stopped
    # T9: the entrypoint chowns its data dir and drops to the clickhouse user, so it keeps those few capabilities
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, KILL]
    mem_limit: 3g
    pids_limit: 2048
    environment:
      CLICKHOUSE_USER: ${OBS_CH_USER:-openlit}
      CLICKHOUSE_PASSWORD: ${OBS_CH_PASSWORD:?run scripts/observability-up.sh}
      CLICKHOUSE_DATABASE: openlit
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "true"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./observability/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
      - ./observability/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:${OBS_CH_HTTP_PORT:-8124}:8123"
    networks: [obs]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  openlit:
    image: ghcr.io/openlit/openlit:2.1.0@sha256:94552ccd09379b5e2fec3c51c4fec1b41d88d6b56b0a5ccc895c116673884fa8
    container_name: gov-obs-openlit
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # T9
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 512
    environment:
      TELEMETRY_ENABLED: "false"
      INIT_DB_HOST: clickhouse
      INIT_DB_PORT: "8123"
      INIT_DB_DATABASE: openlit
      INIT_DB_USERNAME: ${OBS_CH_USER:-openlit}
      INIT_DB_PASSWORD: ${OBS_CH_PASSWORD}
      SQLITE_DATABASE_URL: file:/app/client/data/data.db
      PORT: "3000"
      DOCKER_PORT: "3000"
      OPAMP_ENVIRONMENT: production
      OPAMP_CERTS_DIR: /app/opamp/certs
      OPAMP_TLS_REQUIRE_CLIENT_CERT: "true"
    depends_on:
      clickhouse: {condition: service_healthy}
    volumes:
      - openlitdata:/app/client/data
      - ./observability/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro  # OTLP -> ClickHouse
    ports:
      - "127.0.0.1:${OBS_OPENLIT_PORT:-3300}:3000"   # UI
      - "127.0.0.1:${OBS_OTLP_HTTP_PORT:-4318}:4318" # OTLP/HTTP (host-side tests)
    networks: [obs]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

  grafana:
    image: grafana/grafana-oss:11.6.1@sha256:52c3e20686b860c6dc1f623811565773cf51eefa378817a4896dfc863c3c82c8
    container_name: gov-obs-grafana
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]   # T9
    cap_drop: [ALL]
    mem_limit: 768m
    pids_limit: 256
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${OBS_GRAFANA_PASSWORD:?run scripts/observability-up.sh}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.11.2
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # demo: read-only viewer on localhost
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cost-by-agent.json
      OBS_CH_USER: ${OBS_CH_USER:-openlit}
      OBS_CH_PASSWORD: ${OBS_CH_PASSWORD}
    depends_on:
      clickhouse: {condition: service_healthy}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${OBS_GRAFANA_PORT:-3400}:3000"
    networks: [obs]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 40s

  # ---- profile ebpf: OpenLIT Controller (see docs/results/T6.md for what happens on Docker Desktop) ----
  controller:
    profiles: [ebpf]
    image: ghcr.io/openlit/openlit-controller:0.10.0@sha256:165efd4469ea2fd8916217b8eb67b9d7168f70d6596298928348b80a15eaf511
    container_name: gov-obs-controller
    restart: "no"
    pid: host
    privileged: true          # kprobes need CAP_BPF/PERFMON/SYS_ADMIN and host /proc
    environment:
      OPENLIT_URL: http://openlit:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openlit:4318
      OPENLIT_API_KEY: ${OPENLIT_API_KEY:-}   # create in the OpenLIT UI (API keys); see docs/results/T6.md
      OPENLIT_DEPLOY_MODE: docker
      OPENLIT_POLL_INTERVAL: 15s
      OPENLIT_ENVIRONMENT: govpilot
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    depends_on:
      openlit: {condition: service_healthy}
    networks: [obs]

networks:
  obs:
    name: govpilot_obs
    external: true     # shared with the gateway (deploy/docker-compose.yml); created by scripts/up.sh / observability-up.sh

volumes:
  chdata:
  openlitdata:
  grafanadata:
