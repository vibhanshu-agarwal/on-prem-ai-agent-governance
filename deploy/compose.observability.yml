# T6 observability stack: OpenLIT (UI + OTLP receiver) + ClickHouse + Grafana, kept in its OWN
# compose project so it never touches the governance stack. Bring it up with
# scripts/observability-up.sh (generates .local/observability.env with random passwords).
#
#   docker compose -f deploy/compose.observability.yml --env-file .local/observability.env up -d
#   (optional profiles)  --profile gateway-demo   an OTel-enabled LiteLLM twin (see docs/results/T6.md)
#                        --profile ebpf           OpenLIT Controller (eBPF discovery, see T6.md for the outcome)
#
# Network `obs` is a normal bridge (needed to publish 127.0.0.1 ports). It carries only telemetry:
# the gateway joins it to push OTLP to openlit:4318. Agent containers never join it.
#
# Pinned: OpenLIT 2.1.0 (release 2026-09-10), ClickHouse 24.4.1 (the version OpenLIT's own compose pins),
# Grafana OSS 11.6.1 + ClickHouse datasource plugin 4.11.2.
name: govpilot-obs

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.4.1
    container_name: gov-obs-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${OBS_CH_USER:-openlit}
      CLICKHOUSE_PASSWORD: ${OBS_CH_PASSWORD:?run scripts/observability-up.sh}
      CLICKHOUSE_DATABASE: openlit
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "true"
    volumes:
      - chdata:/var/lib/clickhouse
      - ./observability/clickhouse-config.xml:/etc/clickhouse-server/config.d/custom-config.xml:ro
      - ./observability/clickhouse-init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    ports:
      - "127.0.0.1:${OBS_CH_HTTP_PORT:-8124}:8123"
    networks: [obs]
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s

  openlit:
    image: ghcr.io/openlit/openlit:2.1.0
    container_name: gov-obs-openlit
    restart: unless-stopped
    environment:
      TELEMETRY_ENABLED: "false"
      INIT_DB_HOST: clickhouse
      INIT_DB_PORT: "8123"
      INIT_DB_DATABASE: openlit
      INIT_DB_USERNAME: ${OBS_CH_USER:-openlit}
      INIT_DB_PASSWORD: ${OBS_CH_PASSWORD}
      SQLITE_DATABASE_URL: file:/app/client/data/data.db
      PORT: "3000"
      DOCKER_PORT: "3000"
      OPAMP_ENVIRONMENT: production
      OPAMP_CERTS_DIR: /app/opamp/certs
      OPAMP_TLS_REQUIRE_CLIENT_CERT: "true"
    depends_on:
      clickhouse: {condition: service_healthy}
    volumes:
      - openlitdata:/app/client/data
      - ./observability/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro  # OTLP -> ClickHouse
    ports:
      - "127.0.0.1:${OBS_OPENLIT_PORT:-3300}:3000"   # UI
      - "127.0.0.1:${OBS_OTLP_HTTP_PORT:-4318}:4318" # OTLP/HTTP (host-side tests)
    networks: [obs]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s

  grafana:
    image: grafana/grafana-oss:11.6.1
    container_name: gov-obs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${OBS_GRAFANA_PASSWORD:?run scripts/observability-up.sh}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.11.2
      GF_AUTH_ANONYMOUS_ENABLED: "true"          # demo: read-only viewer on localhost
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/cost-by-agent.json
      OBS_CH_USER: ${OBS_CH_USER:-openlit}
      OBS_CH_PASSWORD: ${OBS_CH_PASSWORD}
    depends_on:
      clickhouse: {condition: service_healthy}
    volumes:
      - grafanadata:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${OBS_GRAFANA_PORT:-3400}:3000"
    networks: [obs]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 40s

  # ---- profile gateway-demo: an OTel-enabled twin of the gateway ------------------------------
  # Same image, same DB/Redis, same config PLUS the otel callback (generated by
  # scripts/observability-up.sh into .local/observability/litellm-otel.yaml). It exists so the
  # telemetry pipeline can be proven without editing deploy/litellm/config.yaml or restarting
  # gov-gateway. The one-line change for the real gateway is documented in docs/results/T6.md.
  # The twin must not join govpilot_providers (only the real gateway and its mocks live there; T1 test), so it
  # gets its own copies of the two mock providers on a private internal network, reachable under the same names.
  obs-mock-local:
    profiles: [gateway-demo]
    image: govpilot/mock-provider:1
    container_name: gov-obs-mock-local
    restart: unless-stopped
    environment:
      PROVIDER_NAME: mock-local
      MODELS: mock-local,mock-local-slow
      FIRST_TOKEN_LATENCY_MS: "20"
      PER_TOKEN_LATENCY_MS: "5"
      API_KEY_SHA256: ${MOCK_LOCAL_API_KEY_SHA256:-unset}
    networks:
      obs_providers: {aliases: [mock-local]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 40

  obs-mock-remote:
    profiles: [gateway-demo]
    image: govpilot/mock-provider:1
    container_name: gov-obs-mock-remote
    restart: unless-stopped
    environment:
      PROVIDER_NAME: mock-remote
      MODELS: mock-remote,mock-remote-slow
      FIRST_TOKEN_LATENCY_MS: "60"
      PER_TOKEN_LATENCY_MS: "10"
      API_KEY_SHA256: ${MOCK_REMOTE_API_KEY_SHA256:-unset}
    networks:
      obs_providers: {aliases: [mock-remote]}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 40

  gateway-otel:
    profiles: [gateway-demo]
    image: ghcr.io/berriai/litellm:v1.100.3
    container_name: gov-gateway-otel
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-unset}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-unset}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-unset}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-unset}
      MOCK_LOCAL_API_KEY: ${MOCK_LOCAL_API_KEY:-unset}
      MOCK_REMOTE_API_KEY: ${MOCK_REMOTE_API_KEY:-unset}
      DISABLE_ADMIN_UI: "True"
      LITELLM_LOG: INFO
      LITELLM_MODE: PRODUCTION
      LITELLM_TELEMETRY: "False"
      # OTel callback -> OpenLIT's built-in OTLP receiver
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://openlit:4318
      OTEL_SERVICE_NAME: govpilot-gateway
    volumes:
      - ../.local/observability/litellm-otel.yaml:/app/config.yaml:ro
      - ./litellm/callbacks:/app/callbacks:ro
    ports:
      - "127.0.0.1:${OBS_GATEWAY_OTEL_PORT:-4200}:4000"
    depends_on:
      obs-mock-local: {condition: service_healthy}
      obs-mock-remote: {condition: service_healthy}
    networks:
      obs: {}
      obs_providers: {}
      govpilot_backend: {}        # Postgres + Redis (the twin shares the gateway's DB and spend counters)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # ---- profile ebpf: OpenLIT Controller (see docs/results/T6.md for what happens on Docker Desktop) ----
  controller:
    profiles: [ebpf]
    image: ghcr.io/openlit/openlit-controller:0.10.0
    container_name: gov-obs-controller
    restart: "no"
    pid: host
    privileged: true          # kprobes need CAP_BPF/PERFMON/SYS_ADMIN and host /proc
    environment:
      OPENLIT_URL: http://openlit:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openlit:4318
      OPENLIT_API_KEY: ${OPENLIT_API_KEY:-}   # create in the OpenLIT UI (API keys); see docs/results/T6.md
      OPENLIT_DEPLOY_MODE: docker
      OPENLIT_POLL_INTERVAL: 15s
      OPENLIT_ENVIRONMENT: govpilot
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    depends_on:
      openlit: {condition: service_healthy}
    networks: [obs]

networks:
  obs:
    name: govpilot_obs
  govpilot_backend:
    name: govpilot_backend
    external: true
  obs_providers:
    name: govpilot_obs_providers
    internal: true

volumes:
  chdata:
  openlitdata:
  grafanadata:
