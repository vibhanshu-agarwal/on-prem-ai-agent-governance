# LiteLLM OSS proxy config (v1.100.3). No Enterprise features used.
#
# Provider credentials are referenced from the gateway container env only
# (os.environ/...). Nothing here is a secret.

model_list:
  # ---- mock-local: stands in for the on-prem "local model" ----------------
  - model_name: mock-local
    litellm_params:
      model: openai/mock-local
      api_base: http://mock-local:8000/v1
      api_key: os.environ/MOCK_LOCAL_API_KEY
      input_cost_per_token: 0.000001      # $1 per 1M input tokens
      output_cost_per_token: 0.000002     # $2 per 1M output tokens
      max_tokens: 256                     # default completion ceiling when the caller sends none
    model_info:
      max_output_tokens: 1024             # ceiling used by native budget reservation
      max_input_tokens: 8192
  - model_name: mock-local-slow           # same provider, very slow streaming (teardown tests)
    litellm_params:
      model: openai/mock-local-slow
      api_base: http://mock-local:8000/v1
      api_key: os.environ/MOCK_LOCAL_API_KEY
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      max_tokens: 256
    model_info:
      max_output_tokens: 1024
      max_input_tokens: 8192

  # ---- mock-remote: stands in for the approved remote provider ------------
  - model_name: mock-remote
    litellm_params:
      model: openai/mock-remote
      api_base: http://mock-remote:8000/v1
      api_key: os.environ/MOCK_REMOTE_API_KEY
      input_cost_per_token: 0.000005      # $5 per 1M input tokens
      output_cost_per_token: 0.000015     # $15 per 1M output tokens
      max_tokens: 256
    model_info:
      max_output_tokens: 1024
      max_input_tokens: 8192
  - model_name: mock-remote-slow
    litellm_params:
      model: openai/mock-remote-slow
      api_base: http://mock-remote:8000/v1
      api_key: os.environ/MOCK_REMOTE_API_KEY
      input_cost_per_token: 0.000005
      output_cost_per_token: 0.000015
      max_tokens: 256
    model_info:
      max_output_tokens: 1024
      max_input_tokens: 8192

# (the guardrail tests' echo model is added by tests/guardrails/echo_config.py in a test-only config overlay)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY        # from deploy/.env (generated, gitignored)
  database_url: os.environ/DATABASE_URL            # enables virtual keys, teams, budgets, spend logs
  # Budget reservation is on by default in this version (estimate max cost, reserve, reconcile).
  # Fail closed: when Redis/cache counters are degraded, validate budgets against Postgres,
  # and reject (503) if a reservation cannot be written. Supported in v1.100.3.
  fail_closed_budget_enforcement: true
  allow_requests_on_db_unavailable: false          # explicit: DB down => reject, never bypass auth/budgets
  # Shared Redis for spend counters, budget reservations and rate limits (cross-pod coordination).
  coordination_redis:
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    password: os.environ/REDIS_PASSWORD
  disable_spend_logs: false
  # Keep the DB spend log flush short so T2 tests observe spend quickly.
  proxy_batch_write_at: 5

litellm_settings:
  drop_params: false
  request_timeout: 600
  # Extra hardening / callbacks are added by later tasks (T4 attribution, T5 guardrails).
  # T2 budget guard (deploy/litellm/callbacks/budget_guard.py): enforces the agent
  # max_tokens ceiling/default and makes worst-case cost fit the native reservation.
  # T4 run attribution (deploy/litellm/callbacks/run_attribution.py): stamps run/parent run/agent/team
  # into the spend logs; rejects requests without a run id for keys whose metadata says
  # attribution.mode=enforce (default mode: audit).
  callbacks: ["callbacks.budget_guard.budget_guard", "callbacks.run_attribution.run_attribution", "callbacks.guardrails_hook.guardrails_hook", "otel"]
  # T6/T8: "otel" exports one span per call (cost, tokens, key metadata, run id) to OpenLIT
  # (OTEL_* env in deploy/docker-compose.yml, network govpilot_obs). The export is asynchronous:
  # an OpenLIT/ClickHouse outage does not block or bypass enforcement (tests/acceptance).
  # T5 guardrails (deploy/litellm/callbacks/guardrails_hook.py + services/guardrails, policy in
  # deploy/guardrails/guardrails.yaml): PII (Presidio), injection/tool/secret rules, approval gate.
  # T2: keep Redis spend counters alive for the whole budget period (>= budget_duration 30d).
  # With the default 60 s TTL an idle counter expires and is reseeded from the Postgres
  # key/team spend columns, which lose unflushed increments when the gateway restarts
  # (proxy_batch_write_at window) -> measured overshoot. See docs/results/T2.md (delayed telemetry).
  # v1.100.3 builds the coordination Redis BEFORE reading litellm_settings, so this value
  # alone does not reach the spend counters; the budget guard applies it to them.
  default_redis_ttl: 2678400

router_settings:
  # Redis holds the shared spend/rate counters used by budget reservation.
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
  num_retries: 0            # explicit: retry behaviour is exercised in T2, not hidden here
