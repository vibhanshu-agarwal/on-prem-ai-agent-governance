# Agent-facing allowlist proxy in front of the LiteLLM gateway (T9; report section 5, "the gateway itself
# gets attacked"). Agents (networks govpilot_agents) reach THIS, not the gateway: only inference routes are
# forwarded, everything else (/key/*, /team/*, /user/*, /mcp-rest/*, /config/*, /model/*, /spend/*, /ui, docs,
# metrics, ...) gets 403 here and never reaches LiteLLM. The control plane / estop / auth proxy talk to the
# gateway directly on the backend network (alias `gateway`), a separate path the agents cannot reach.
#
# Matching is on the DECODED, slash-merged path ($uri) with exact locations, and the upstream receives that
# normalised path, so encodings and `..` tricks cannot smuggle a different route through.
pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  default_type application/json;
  log_format gw '$time_iso8601 $remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout gw;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  underscores_in_headers off;
  ignore_invalid_headers on;
  client_max_body_size 8m;          # an 8K-token prompt is ~40 KB; this bounds abuse
  client_body_timeout 30s;
  client_header_timeout 10s;
  keepalive_timeout 65s;
  resolver 127.0.0.11 valid=5s ipv6=off;   # Docker DNS: re-resolve, the gateway container is recreated often

  server {
    listen 4000 default_server;
    server_name _;

    set $core http://gateway-core:4000;

    # ---- shared proxy settings (inherited by the locations below)
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;              # SSE streams pass through chunk by chunk (the budget guard cuts streams)
    proxy_request_buffering on;       # body-size limit enforced before anything reaches the gateway
    proxy_read_timeout 610s;          # gateway request_timeout is 600 s
    proxy_send_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_ignore_client_abort off;    # client gone -> upstream closed -> generation (and spend) stops

    # ---- inference routes (the only ones an agent may call)
    location = /v1/chat/completions { limit_except POST { deny all; } proxy_pass $core$uri$is_args$args; }
    location = /chat/completions    { limit_except POST { deny all; } proxy_pass $core$uri$is_args$args; }
    location = /v1/completions      { limit_except POST { deny all; } proxy_pass $core$uri$is_args$args; }
    location = /completions         { limit_except POST { deny all; } proxy_pass $core$uri$is_args$args; }
    location = /v1/embeddings       { limit_except POST { deny all; } proxy_pass $core$uri$is_args$args; }
    location = /embeddings          { limit_except POST { deny all; } proxy_pass $core$uri$is_args$args; }
    location = /v1/models           { limit_except GET  { deny all; } proxy_pass $core$uri$is_args$args; }
    location = /models              { limit_except GET  { deny all; } proxy_pass $core$uri$is_args$args; }
    # liveness only: /health, /health/readiness, /health/services leak versions and dependency state
    location = /health/liveliness   { limit_except GET  { deny all; } proxy_pass $core$uri; }
    location = /health/liveness     { limit_except GET  { deny all; } proxy_pass $core$uri; }

    # ---- everything else
    location / {
      return 403 '{"error":{"message":"route not available to agents","type":"forbidden_route","code":"403"}}';
    }
  }
}
