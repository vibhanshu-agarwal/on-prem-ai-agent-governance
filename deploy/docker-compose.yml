# T1 foundation stack. Run via scripts/bootstrap.sh (generates deploy/.env first).
#
# Networks
#   agents     internal. Agent containers join this. Only `gateway` is reachable on it.
#   providers  internal. Only `gateway` and the mock providers join it.
#   backend    internal. Only `gateway`, postgres, redis.
#   edge       normal bridge. Only `gateway` joins it, purely so Docker can publish
#              the gateway port to 127.0.0.1 (internal networks cannot publish ports)
#              and so the gateway could later reach approved remote providers.
#   obs        telemetry network (external, owned by no project; scripts create it). Only the
#              gateway (OTLP export) and the observability stack join it.
name: govpilot

x-healthcheck-defaults: &hc
  interval: 5s
  timeout: 5s
  retries: 30

services:
  postgres:
    image: postgres:16.14-alpine
    container_name: gov-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/bootstrap.sh}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      <<: *hc

  redis:
    image: redis:7.4.8-alpine
    container_name: gov-redis
    restart: unless-stopped
    # NOTE: no host port published. Host 6379 belongs to another project.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run scripts/bootstrap.sh}
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      <<: *hc

  mock-local:
    build: ../services/mock-provider
    image: govpilot/mock-provider:1
    container_name: gov-mock-local
    restart: unless-stopped
    environment:
      PROVIDER_NAME: mock-local
      MODELS: mock-local,mock-local-slow
      FIRST_TOKEN_LATENCY_MS: "20"
      PER_TOKEN_LATENCY_MS: "5"
      SLOW_MODE: "0"
      SLOW_FACTOR: "100"
      # only a hash: the provider credential itself lives solely in the gateway env
      API_KEY_SHA256: ${MOCK_LOCAL_API_KEY_SHA256:?run scripts/bootstrap.sh}
    networks: [providers]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      <<: *hc

  mock-remote:
    image: govpilot/mock-provider:1
    container_name: gov-mock-remote
    restart: unless-stopped
    depends_on: [mock-local]   # reuse the image built by mock-local
    environment:
      PROVIDER_NAME: mock-remote
      MODELS: mock-remote,mock-remote-slow
      FIRST_TOKEN_LATENCY_MS: "60"
      PER_TOKEN_LATENCY_MS: "10"
      SLOW_MODE: "0"
      SLOW_FACTOR: "100"
      API_KEY_SHA256: ${MOCK_REMOTE_API_KEY_SHA256:?run scripts/bootstrap.sh}
    networks: [providers]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      <<: *hc

  # T5: self-hosted Presidio (pinned). Internal `backend` network only: agents cannot reach them.
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362
    container_name: gov-presidio-analyzer
    restart: unless-stopped
    environment:
      PORT: "3000"
      WORKERS: "3"     # gunicorn workers: long prompts are analysed in parallel chunks (see T5.md latency)
      RECOGNIZER_REGISTRY_CONF_FILE: /conf/recognizers.yaml   # structured PII only; drops FP-prone country recognizers
    volumes:
      - ./guardrails/presidio-recognizers.yaml:/conf/recognizers.yaml:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362
    container_name: gov-presidio-anonymizer
    restart: unless-stopped
    environment:
      PORT: "3000"
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3000/health',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s

  gateway:
    image: ghcr.io/berriai/litellm:v1.100.3
    container_name: gov-gateway
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mock-local: {condition: service_healthy}
      mock-remote: {condition: service_healthy}
      presidio-analyzer: {condition: service_healthy}
      presidio-anonymizer: {condition: service_healthy}
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?run scripts/bootstrap.sh}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?run scripts/bootstrap.sh}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # provider credentials: present ONLY in the gateway container
      MOCK_LOCAL_API_KEY: ${MOCK_LOCAL_API_KEY:?run scripts/bootstrap.sh}
      MOCK_REMOTE_API_KEY: ${MOCK_REMOTE_API_KEY:?run scripts/bootstrap.sh}
      DISABLE_ADMIN_UI: "True"
      LITELLM_LOG: INFO
      LITELLM_MODE: PRODUCTION       # do not auto-load a .env file / dev conveniences
      LITELLM_TELEMETRY: "False"
      # T6/T8: OpenTelemetry export of every call to OpenLIT (evidence plane; "otel" callback in config.yaml).
      # Asynchronous batch export: if OpenLIT is down, spans are dropped, requests and enforcement are unaffected.
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://openlit:4318
      OTEL_SERVICE_NAME: govpilot-gateway
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/callbacks:/app/callbacks:ro   # custom callbacks (T2 budget guard; T4 attribution; T5 guardrails)
      - ../services/guardrails/govguard:/opt/govguard/govguard:ro   # T5 guardrail pipeline (imported by the hook)
      - ./guardrails:/app/guardrails:ro                             # T5 guardrail policy
      - ../.local/guardrails:/app/guardrails-state                  # T5 audit log, overrides, approvals (rw)
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-4000}:4000"
    networks:
      agents:
        aliases: [gateway]
      providers: {}
      backend: {}
      edge: {}
      obs: {}          # telemetry only (OTLP to openlit:4318); agents never join it
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

networks:
  agents:
    name: govpilot_agents
    internal: true
  providers:
    name: govpilot_providers
    internal: true
  backend:
    name: govpilot_backend
    internal: true
  edge:
    name: govpilot_edge
  obs:                 # shared with deploy/compose.observability.yml; created by scripts/up.sh / bootstrap.sh
    name: govpilot_obs
    external: true

volumes:
  pgdata:
  redisdata:
