[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govguard"
version = "0.1.0"
description = "Guardrail pipeline (PII engine port + deterministic rules) used by the LiteLLM guardrail hook"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "httpx>=0.27"]

[project.scripts]
guardctl = "govguard.cli:main"

[tool.setuptools]
packages = ["govguard"]
