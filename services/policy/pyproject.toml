[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govpolicy"
version = "0.1.0"
description = "Policy-as-code: schema, signed bundles, admission check, rollback"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "cryptography>=42", "pydantic>=2.5"]

[project.scripts]
policyctl = "govpolicy.cli:main"

[tool.setuptools]
packages = ["govpolicy"]
